<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam or Not?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: a single phone-width column — scoreboard, a stack of message cards you swipe left (scam) or right (safe), the reveal panel, then the golden rules */
:root {
  color-scheme: light;
  --bg: #ece9f6;
  --card: #ffffff;
  --ink: #221c3a;
  --muted: #625d7a;
  --line: #d7d2ea;
  --scam: #e8453c;
  --scam-soft: #fde3e1;
  --safe: #1f9d63;
  --safe-soft: #d9f3e6;
  --violet: #5b3fd1;
  --bubble: #dcf8c6;
  --font: "Rubik", system-ui, -apple-system, sans-serif;
  --scale: 1;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 calc(17px * var(--scale))/1.5 var(--font); }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: grid; gap: 18px; }
.back { justify-self: start; font-size: .9rem; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--violet); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
header { display: grid; gap: 6px; }
h1 { font: 800 clamp(2.4rem, 10vw, 3.4rem)/1 var(--font); margin: 0; letter-spacing: -.02em; }
h1 .q { color: var(--scam); display: inline-block; transform: rotate(8deg); }
.lede { margin: 0; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.score { display: flex; gap: 8px; }
.pill { font: 700 .95rem var(--font); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; }
.big { font: 500 .95rem var(--font); background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.big[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

.deck { position: relative; min-height: 330px; }
.card { position: absolute; inset: 0; background: var(--card); border-radius: 24px; box-shadow: 0 18px 40px -22px rgba(34, 28, 58, .45); padding: 18px; display: grid; grid-template-rows: auto 1fr; gap: 12px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.card.under { transform: translateY(12px) scale(.96); opacity: .6; cursor: default; }
.card.dragging { cursor: grabbing; }
.card.fly { transition: transform .35s ease, opacity .35s ease; }
.from { display: flex; align-items: center; gap: 10px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--font); color: #fff; flex: none; }
.from b { display: block; font-size: 1.05rem; overflow-wrap: anywhere; }
.from small { color: var(--muted); font-size: .85rem; }
.msg { align-self: start; background: var(--bubble); border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 1.12rem; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
.msg.sms { background: #eef0f4; }
.msg .link { color: #1a5fd0; text-decoration: underline; }
.stamp { position: absolute; top: 22px; font: 800 1.6rem var(--font); padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; pointer-events: none; }
.stamp.scam { right: 18px; color: var(--scam); transform: rotate(12deg); }
.stamp.safe { left: 18px; color: var(--safe); transform: rotate(-12deg); }
.hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .85rem; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { font: 800 1.25rem var(--font); border: 0; border-radius: 18px; padding: 16px 10px; cursor: pointer; color: #fff; }
.choice.scam { background: var(--scam); }
.choice.safe { background: var(--safe); }
.choice:disabled { opacity: .4; cursor: not-allowed; }

.reveal { border-radius: 20px; padding: 16px; display: grid; gap: 10px; }
.reveal.right { background: var(--safe-soft); }
.reveal.wrong { background: var(--scam-soft); }
.reveal h2 { margin: 0; font: 800 1.5rem/1.15 var(--font); }
.reveal p { margin: 0; }
.flags { display: flex; flex-wrap: wrap; gap: 8px; }
.flag { font: 700 .9rem var(--font); background: var(--card); color: var(--scam); border: 2px solid var(--scam); border-radius: 999px; padding: 4px 10px; }
.flag.ok { color: var(--safe); border-color: var(--safe); }
.next { font: 700 1.1rem var(--font); background: var(--ink); color: #fff; border: 0; border-radius: 14px; padding: 12px; cursor: pointer; }

.end { background: var(--card); border-radius: 24px; padding: 22px; display: grid; gap: 12px; text-align: center; box-shadow: 0 18px 40px -22px rgba(34, 28, 58, .45); }
.end .num { font: 800 4rem/1 var(--font); color: var(--violet); font-variant-numeric: tabular-nums; }
.end h2 { margin: 0; font: 800 1.6rem var(--font); }

.rules { background: var(--ink); color: #fff; border-radius: 24px; padding: 20px; display: grid; gap: 12px; }
.rules h2 { margin: 0; font: 800 1.5rem var(--font); }
.rules ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.rules .help { background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 12px 14px; }
.rules .help b { font-size: 1.6rem; color: #ffd166; }
.rules a { color: #ffd166; }
footer { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
@media (prefers-reduced-motion: reduce) { .card.fly { transition: none; } }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef, useMemo } = React;

// All senders, numbers and links below are invented for practice. None are real.
const MESSAGES = [
  { id: 1, scam: true, kind: "sms", from: "BNK-ALERT", sub: "SMS", text: "Dear customer, your account will be BLOCKED today as KYC is pending. Update now: [kyc-bank-update.top]", flags: ["Urgency", "Threat to block account", "Odd link"], why: "Banks never ask you to update KYC through a link in an SMS. Visit the branch or use the bank's own app." },
  { id: 2, scam: false, kind: "sms", from: "Your Bank", sub: "SMS", text: "OTP for your transaction of ₹1,250 is 482913. Do NOT share this OTP with anyone. Bank staff will never ask for it.", flags: ["You started this payment", "Says don't share"], why: "This is a normal OTP message for a payment you made yourself. Just never read the OTP out to anyone." },
  { id: 3, scam: true, kind: "wa", from: "International number", sub: "WhatsApp", text: "Congratulations!! Your number won ₹25,00,000 in the lucky draw 🎉 To claim, pay ₹4,999 processing fee. Call our manager now.", flags: ["Too good to be true", "Pay to receive", "Unknown international number"], why: "You can't win a draw you never entered, and real prizes never ask you to pay a fee first." },
  { id: 4, scam: false, kind: "wa", from: "Priya (Akka)", sub: "WhatsApp", text: "Reached home? Amma was asking. Call when free 🙂", flags: ["Known contact", "No money or link"], why: "A known person, no link, no money, no hurry. Nothing to worry about." },
  { id: 5, scam: true, kind: "sms", from: "+91 9xxxx xxxxx", sub: "SMS", text: "Dear consumer, your electricity will be disconnected TONIGHT at 9:30 pm as last month bill not updated. Call officer immediately on 9xxxx xxxxx.", flags: ["Urgency", "Threat", "Personal mobile number"], why: "Electricity boards don't send threats from personal numbers. Check your bill on the board's official app or website." },
  { id: 6, scam: true, kind: "wa", from: "Unknown", sub: "WhatsApp", text: "Hello sir, I sent ₹5,000 to your UPI by mistake 🙏 Please check and return. I have sent you a request, just enter your PIN.", flags: ["Asks for UPI PIN", "Guilt trip", "Unknown number"], why: "You never need your UPI PIN to receive money. Entering the PIN on a 'collect request' sends money out of your account." },
  { id: 7, scam: false, kind: "sms", from: "Your Bank", sub: "SMS", text: "₹450 debited from A/c XX1234 at a supermarket on 09-Oct. Not you? Call the number on the back of your card.", flags: ["Matches your purchase", "Points to the number on your card"], why: "A normal debit alert. If it's not you, call the number printed on your own card, not one sent in a message." },
  { id: 8, scam: true, kind: "wa", from: "HR - Part Time Job", sub: "WhatsApp", text: "Earn ₹3,000–₹8,000 daily from home! Just like YouTube videos and send screenshots. Joining fee ₹1,000 only. Reply YES.", flags: ["Too good to be true", "Pay to join", "Easy money"], why: "Real jobs don't pay you to like videos or charge a joining fee. This task scam slowly takes bigger and bigger 'deposits'." },
  { id: 9, scam: true, kind: "wa", from: "Courier Customs Dept", sub: "WhatsApp video call", text: "Your parcel to Taiwan has illegal items. A police officer will join a video call now. Do not tell family. Stay on the call. This is a case of digital arrest.", flags: ["Fear and threats", "Keep it secret", "Video call 'arrest'"], why: "There is no such thing as a 'digital arrest'. Police never arrest or question people over WhatsApp video calls. Hang up and tell family." },
  { id: 10, scam: false, kind: "sms", from: "Delivery", sub: "SMS", text: "Your order is out for delivery today. Share OTP 3307 only with the delivery person when you receive the parcel.", flags: ["You ordered it", "OTP only at the door"], why: "Normal delivery message for something you ordered. Share the code only in person, at the door." },
  { id: 11, scam: true, kind: "wa", from: "Unknown number", sub: "WhatsApp", text: "Amma it's me, my phone broke so new number. Urgent, need ₹15,000 for hospital. Please send to this UPI fast, will explain later.", flags: ["New number pretending", "Urgency", "Asks for money"], why: "Scammers pretend to be a son or daughter in trouble. Call their old number or another family member before sending anything." },
  { id: 12, scam: true, kind: "sms", from: "REWARDS", sub: "SMS", text: "You have unclaimed reward points worth ₹7,850 expiring today! Redeem now: [redeem-pointz.click]", flags: ["Urgency", "Odd link", "Too good to be true"], why: "Reward-point links lead to fake pages that steal card details. Check points only in your bank's own app." },
];

function shuffle(a, seed) {
  const r = [...a]; let s = seed;
  for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function Message({ m }) {
  const parts = m.text.split(/(\[[^\]]+\])/g);
  const colours = ["#5b3fd1", "#e8453c", "#1f9d63", "#e38b06", "#2b7bd6"];
  return (
    <>
      <div className="from">
        <div className="avatar" style={{ background: colours[m.id % colours.length] }}>{m.from.replace(/[^A-Za-z+]/g, "").slice(0, 2).toUpperCase() || "?"}</div>
        <div><b>{m.from}</b><small>{m.sub}</small></div>
      </div>
      <div className={`msg ${m.kind === "sms" ? "sms" : ""}`}>
        {parts.map((p, i) => p.startsWith("[") ? <span key={i} className="link">{p.slice(1, -1)}</span> : p)}
      </div>
    </>
  );
}

function App() {
  const [seed, setSeed] = useState(7);
  const deck = useMemo(() => shuffle(MESSAGES, seed), [seed]);
  const [i, setI] = useState(0);
  const [answer, setAnswer] = useState(null); // { saidScam, right }
  const [right, setRight] = useState(0);
  const [bigText, setBigText] = useState(false);
  const [drag, setDrag] = useState({ x: 0, active: false, fly: 0 });
  const start = useRef(null);
  const done = i >= deck.length;
  const m = deck[i];

  function decide(saidScam) {
    if (answer || done) return;
    const ok = saidScam === m.scam;
    if (ok) setRight((r) => r + 1);
    setDrag({ x: saidScam ? -600 : 600, active: false, fly: 1 });
    setTimeout(() => { setAnswer({ saidScam, ok }); setDrag({ x: 0, active: false, fly: 0 }); }, 260);
  }
  function next() { setAnswer(null); setI((v) => v + 1); }
  function restart() { setSeed((s) => s + 1); setI(0); setRight(0); setAnswer(null); }

  const down = (e) => { if (answer) return; start.current = e.clientX; e.currentTarget.setPointerCapture?.(e.pointerId); setDrag({ x: 0, active: true, fly: 0 }); };
  const move = (e) => { if (start.current === null) return; setDrag((d) => ({ ...d, x: e.clientX - start.current })); };
  const up = () => {
    if (start.current === null) return;
    start.current = null;
    if (drag.x < -90) decide(true);
    else if (drag.x > 90) decide(false);
    else setDrag({ x: 0, active: false, fly: 1 });
  };

  const tilt = drag.x / 18;
  const scamStamp = Math.min(1, Math.max(0, -drag.x / 110));
  const safeStamp = Math.min(1, Math.max(0, drag.x / 110));
  const score = Math.round((right / deck.length) * 100);

  return (
    <div className="wrap" style={{ "--scale": bigText ? 1.18 : 1 }}>
      <a className="back" href="../">← Hariesh's Lab</a>
      <header>
        <h1>Scam or Not<span className="q">?</span></h1>
        <p className="lede">Messages like these reach Indian phones every day. Swipe left if it's a scam, right if it's safe. Play it with Amma and Appa.</p>
      </header>

      <div className="bar">
        <div className="score">
          <span className="pill">{Math.min(i + 1, deck.length)} / {deck.length}</span>
          <span className="pill">✓ {right} caught</span>
        </div>
        <button className="big" aria-pressed={bigText} onClick={() => setBigText((v) => !v)}>Big text</button>
      </div>

      {!done ? (
        <>
          <div className="deck">
            {deck[i + 1] && !answer && <div className="card under" aria-hidden="true"><Message m={deck[i + 1]} /></div>}
            <div className={`card ${drag.active ? "dragging" : ""} ${drag.fly ? "fly" : ""}`}
                 style={{ transform: `translateX(${drag.x}px) rotate(${tilt}deg)`, opacity: 1, outline: answer ? `4px solid ${m.scam ? "var(--scam)" : "var(--safe)"}` : "none" }}
                 onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
                 aria-label={`Message from ${m.from}`}>
              <Message m={m} />
              <span className="stamp scam" style={{ opacity: scamStamp }}>SCAM</span>
              <span className="stamp safe" style={{ opacity: safeStamp }}>SAFE</span>
              {!answer && <span className="hint">← swipe scam · swipe safe →</span>}
            </div>
          </div>

          {!answer ? (
            <div className="choices">
              <button className="choice scam" onClick={() => decide(true)}>🚩 Scam</button>
              <button className="choice safe" onClick={() => decide(false)}>✅ Safe</button>
            </div>
          ) : (
            <div className={`reveal ${answer.ok ? "right" : "wrong"}`} aria-live="polite">
              <h2>{answer.ok ? (m.scam ? "Caught it! That's a scam." : "Right, that one's safe.") : (m.scam ? "Careful, that's a scam." : "That one was actually safe.")}</h2>
              <div className="flags">{m.flags.map((f) => <span key={f} className={`flag ${m.scam ? "" : "ok"}`}>{m.scam ? "🚩 " : "✓ "}{f}</span>)}</div>
              <p>{m.why}</p>
              <button className="next" onClick={next}>{i === deck.length - 1 ? "See my score" : "Next message"}</button>
            </div>
          )}
        </>
      ) : (
        <div className="end" aria-live="polite">
          <div className="num">{right}/{deck.length}</div>
          <h2>{score >= 90 ? "Scam-proof! Teach the family." : score >= 70 ? "Sharp eyes. Just a few slipped through." : score >= 50 ? "Good start. Read the golden rules below." : "Scammers would love you. Let's practise again."}</h2>
          <button className="next" onClick={restart}>Play again with new order</button>
        </div>
      )}

      <section className="rules">
        <h2>5 golden rules</h2>
        <ol>
          <li>Never share an OTP or UPI PIN with anyone, not even "bank staff".</li>
          <li>You never need a PIN to receive money. A PIN only sends money out.</li>
          <li>Banks and electricity boards don't send KYC or disconnection links.</li>
          <li>Police never arrest or question anyone on a video call.</li>
          <li>Hurry, fear, or a prize? Stop, and call someone you trust first.</li>
        </ol>
        <div className="help">Lost money? Call <b>1930</b> right away, the national cybercrime helpline, and report at <a href="https://cybercrime.gov.in" target="_blank" rel="noopener">cybercrime.gov.in</a>. The faster you report, the better the chance of freezing the money.</div>
      </section>

      <footer><span>Made by Hariesh</span><span>All messages are made up for practice</span></footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
